name: Breakwater Research Refresh (Sharded)
on:
  workflow_dispatch:
    inputs:
      deep_audit:
        description: Optional weighted 5000-bar, 1-48 horizon audit
        required: false
        default: none
        type: choice
        options:
          - none
          - native
          - hip3
          - all
concurrency:
  group: breakwater-research
  cancel-in-progress: false
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  # ---------------------------------------------------------------------------
  # SHARD: 8 parallel jobs — 4 horizons × 2 kinds (SPOT/PERP)
  # Each shard does 1 horizon × 1 kind × 40 pairs × 1000 candles × 38 features
  # ~0.5s per 1000 bars after optimization, ~60-90min per shard
  # All 8 finish in parallel in ~90min vs 7h38m sequential for 38 features
  # ---------------------------------------------------------------------------
  research-shard:
    strategy:
      fail-fast: false
      matrix:
        horizon: [12, 15, 20, 24]
        kind: [SPOT, PERP]
    runs-on: ${{ vars.BREAKWATER_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 180
    name: research h${{ matrix.horizon }} ${{ matrix.kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Ingest universe and run slice research shard h${{ matrix.horizon }} ${{ matrix.kind }}
        env:
          VALR_API_KEY: ${{ secrets.VALR_API_KEY }}
          VALR_API_SECRET: ${{ secrets.VALR_API_SECRET }}
          BREAKWATER_MODE: readonly
          BREAKWATER_MIN_NET_EDGE: ${{ vars.BREAKWATER_MIN_NET_EDGE || '0.004' }}
          BREAKWATER_MIN_NET_EDGE_COST_MULT: ${{ vars.BREAKWATER_MIN_NET_EDGE_COST_MULT || '2' }}
          BREAKWATER_MIN_NET_EDGE_TOP_QUANTILE: ${{ vars.BREAKWATER_MIN_NET_EDGE_TOP_QUANTILE || '0.25' }}
          BREAKWATER_MIN_NET_EDGE_KEEP_QUANTILE: ${{ vars.BREAKWATER_MIN_NET_EDGE_KEEP_QUANTILE || '0.40' }}
          BREAKWATER_SPOT_FEE_BPS: ${{ vars.BREAKWATER_SPOT_FEE_BPS || '70' }}
          BREAKWATER_PERP_FEE_BPS: ${{ vars.BREAKWATER_PERP_FEE_BPS || '9' }}
          BREAKWATER_PROMOTION_MULTI_HORIZON_MIN_PASSES: ${{ vars.BREAKWATER_PROMOTION_MULTI_HORIZON_MIN_PASSES || '2' }}
          BREAKWATER_PROMOTION_MULTI_HORIZON_SELECT: ${{ vars.BREAKWATER_PROMOTION_MULTI_HORIZON_SELECT || 'edge_per_bar' }}
          BREAKWATER_RESEARCH_HORIZONS: ${{ matrix.horizon }}
          BREAKWATER_RESEARCH_HORIZONS_MAX: "24"
          BREAKWATER_RESEARCH_HORIZON_BARS: ${{ matrix.horizon }}
          BREAKWATER_RESEARCH_SHARD: h${{ matrix.horizon }}_${{ matrix.kind }}
          BREAKWATER_RESEARCH_KIND: ${{ matrix.kind }}
          BREAKWATER_SPOT_CANDLE_COUNT: ${{ vars.BREAKWATER_SPOT_CANDLE_COUNT || '1000' }}
          BREAKWATER_PERP_CANDLE_COUNT: ${{ vars.BREAKWATER_PERP_CANDLE_COUNT || '1000' }}
          BREAKWATER_RESEARCH_MAX_PAIRS: ${{ vars.BREAKWATER_RESEARCH_MAX_PAIRS || '40' }}
          BREAKWATER_DISCOVERY_STATE_QUANTILES: ${{ vars.BREAKWATER_DISCOVERY_STATE_QUANTILES || '0.333333,0.666666' }}
          BREAKWATER_DISCOVERY_ROLLING_MIN_PERIODS: ${{ vars.BREAKWATER_DISCOVERY_ROLLING_MIN_PERIODS || '200' }}
          BREAKWATER_CANDLE_PAGE_SLEEP_SECONDS: ${{ vars.BREAKWATER_CANDLE_PAGE_SLEEP_SECONDS || '0.05' }}
          BREAKWATER_VALIDATION_REQUIRE_BONFERRONI: "0"
          BREAKWATER_VALIDATION_RELAXED_MIN_PASSES: ${{ vars.BREAKWATER_VALIDATION_RELAXED_MIN_PASSES || '2' }}
          BREAKWATER_BREADTH_MIN_SYMBOLS: ${{ vars.BREAKWATER_BREADTH_MIN_SYMBOLS || '6' }}
          BREAKWATER_BREADTH_MIN_ROWS_PER_SYMBOL: ${{ vars.BREAKWATER_BREADTH_MIN_ROWS_PER_SYMBOL || '10' }}
          BREAKWATER_BREADTH_MIN_POSITIVE_FRACTION: ${{ vars.BREAKWATER_BREADTH_MIN_POSITIVE_FRACTION || '0.40' }}
          BREAKWATER_PER_ASSET_MIN_ROWS: ${{ vars.BREAKWATER_PER_ASSET_MIN_ROWS || '20' }}
          BREAKWATER_PER_ASSET_MIN_FOLD_POSITIVE_FRACTION: ${{ vars.BREAKWATER_PER_ASSET_MIN_FOLD_POSITIVE_FRACTION || '0.60' }}
          BREAKWATER_PER_ASSET_FOLD_MIN_ROWS: ${{ vars.BREAKWATER_PER_ASSET_FOLD_MIN_ROWS || '3' }}
          BREAKWATER_CONCENTRATED_PROMOTE: ${{ vars.BREAKWATER_CONCENTRATED_PROMOTE || '1' }}
          BREAKWATER_CONCENTRATED_MIN_MEAN: ${{ vars.BREAKWATER_CONCENTRATED_MIN_MEAN || '0.004' }}
        run: |
          echo "Shard h${{ matrix.horizon }} ${{ matrix.kind }} starting"
          PYTHONPATH=src python scripts/breakwater.py research
          echo "Shard done, files:"
          ls -lh localdata/research/*h${{ matrix.horizon }}_${{ matrix.kind }}.csv || true
      - name: Upload shard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: research-h${{ matrix.horizon }}-${{ matrix.kind }}
          path: |
            localdata/research/discovered_slices_h${{ matrix.horizon }}_${{ matrix.kind }}.csv
            localdata/research/validated_slices_h${{ matrix.horizon }}_${{ matrix.kind }}.csv
            localdata/research/asset_edges_h${{ matrix.horizon }}_${{ matrix.kind }}.csv
          if-no-files-found: error
          retention-days: 2
  merge:
    needs: research-shard
    runs-on: ${{ vars.BREAKWATER_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          path: /tmp/shards
          pattern: research-h*
          merge-multiple: true
      - name: Merge shards and sync book
        env:
          BREAKWATER_MODE: readonly
          BREAKWATER_MIN_NET_EDGE: ${{ vars.BREAKWATER_MIN_NET_EDGE || '0.004' }}
          BREAKWATER_MIN_NET_EDGE_COST_MULT: ${{ vars.BREAKWATER_MIN_NET_EDGE_COST_MULT || '2' }}
          BREAKWATER_MIN_NET_EDGE_TOP_QUANTILE: ${{ vars.BREAKWATER_MIN_NET_EDGE_TOP_QUANTILE || '0.25' }}
          BREAKWATER_MIN_NET_EDGE_KEEP_QUANTILE: ${{ vars.BREAKWATER_MIN_NET_EDGE_KEEP_QUANTILE || '0.40' }}
          BREAKWATER_SPOT_FEE_BPS: ${{ vars.BREAKWATER_SPOT_FEE_BPS || '70' }}
          BREAKWATER_PERP_FEE_BPS: ${{ vars.BREAKWATER_PERP_FEE_BPS || '9' }}
          BREAKWATER_PROMOTION_MULTI_HORIZON_MIN_PASSES: ${{ vars.BREAKWATER_PROMOTION_MULTI_HORIZON_MIN_PASSES || '2' }}
          BREAKWATER_PROMOTION_MULTI_HORIZON_SELECT: ${{ vars.BREAKWATER_PROMOTION_MULTI_HORIZON_SELECT || 'edge_per_bar' }}
        run: |
          set -euo pipefail
          echo "=== Shards downloaded ==="
          ls -lh /tmp/shards/
          echo "=== Merging ==="
          PYTHONPATH=src python - <<'PY'
          import csv, glob
          from pathlib import Path
          def merge_csv(pattern, out_path, headers):
              files = glob.glob(pattern)
              if not files:
                  print(f"No files for {pattern}")
                  return 0
              rows=[]
              for fp in files:
                  try:
                      with open(fp, newline="") as f:
                          r=csv.DictReader(f)
                          for row in r:
                              rows.append(row)
                  except Exception as e:
                      print(f"Failed to read {fp}: {e}")
              by_id={}
              for row in rows:
                  sid=row.get("slice_id","")
                  h=row.get("horizon_bars","")
                  if h and f":h{h}" not in sid:
                      row["slice_id"]=f"{sid}:h{h}"
                      sid=row["slice_id"]
                  prev=by_id.get(sid)
                  if prev is None:
                      by_id[sid]=row
                  else:
                      try:
                          if float(row.get("mean_ret_costadj",0)) > float(prev.get("mean_ret_costadj",0)):
                              by_id[sid]=row
                      except:
                          pass
              out_path.parent.mkdir(parents=True, exist_ok=True)
              with open(out_path,"w",newline="") as out:
                  w=csv.DictWriter(out, fieldnames=headers)
                  w.writeheader()
                  w.writerows(by_id.values())
              print(f"Merged {pattern} -> {out_path} {len(by_id)} rows from {len(files)} files (raw {len(rows)})")
              return len(by_id)
          from breakwater.discovery import DISCOVERY_HEADERS
          from breakwater.validation import VALIDATED_HEADERS, ASSET_EDGE_HEADERS
          n_disc = merge_csv("/tmp/shards/discovered_slices_h*.csv", Path("localdata/research/discovered_slices.csv"), DISCOVERY_HEADERS)
          n_val = merge_csv("/tmp/shards/validated_slices_h*.csv", Path("localdata/research/validated_slices.csv"), VALIDATED_HEADERS)
          files=glob.glob("/tmp/shards/asset_edges_h*.csv")
          if files:
              rows=[]
              for fp in files:
                  with open(fp, newline="") as f:
                      r=csv.DictReader(f)
                      rows.extend(list(r))
              out=Path("localdata/research/asset_edges.csv")
              out.parent.mkdir(parents=True, exist_ok=True)
              with open(out,"w",newline="") as outf:
                  w=csv.DictWriter(outf, fieldnames=ASSET_EDGE_HEADERS)
                  w.writeheader()
                  w.writerows(rows)
              print(f"Merged asset_edges {len(rows)} rows from {len(files)} files")
          else:
              print("No asset_edges shards found")
          from breakwater.config import get_settings
          from breakwater.research_lifecycle import sync_book
          from datetime import datetime, timezone
          settings=get_settings()
          summary=sync_book(validated_path=settings.validated_path, book_path=settings.book_path, now=datetime.now(timezone.utc))
          print(f"=== Book sync summary ===")
          for k,v in summary.items():
              print(f"  {k}: {v}")
          PY
      - name: Validation diagnostics summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f localdata/research/validated_slices.csv ]; then
            echo "No localdata/research/validated_slices.csv found; skipping diagnostics."
            exit 0
          fi
          PYTHONPATH=src python - <<'PY'
          import csv
          from collections import Counter
          path = "localdata/research/validated_slices.csv"
          required_cols = ["slice_id","validated","mean_ret_costadj","fail_reasons","temporal_pass","direction_ok","breadth_ok","recency_ok","mean_positive","regime_confounded"]
          def split_reasons(s: str):
              s = (s or "").strip()
              if not s: return []
              return [t.strip() for t in s.split(",") if t.strip()]
          total=0; validated_true=0; by_gate_false=Counter(); by_reason=Counter(); near_miss=[]
          with open(path, newline="") as f:
              r=csv.DictReader(f)
              missing=[c for c in required_cols if c not in (r.fieldnames or [])]
              if missing: raise SystemExit(f"validated_slices.csv missing columns: {missing}")
              for row in r:
                  total+=1
                  ok=(row.get("validated")=="True")
                  if ok: validated_true+=1
                  for g in ["temporal_pass","direction_ok","breadth_ok","recency_ok","mean_positive"]:
                      if row.get(g)=="False": by_gate_false[g]+=1
                  if row.get("regime_confounded")=="True": by_gate_false["regime_confounded"]+=1
                  reasons=split_reasons(row.get("fail_reasons",""))
                  for t in reasons: by_reason[t]+=1
                  if (not ok) and len(reasons)==1:
                      try: mean=float(row.get("mean_ret_costadj") or "nan")
                      except: mean=float("-inf")
                      near_miss.append((mean,row.get("slice_id",""),reasons[0]))
          print(f"Rows: {total}")
          print(f"Validated True: {validated_true}")
          print("")
          print("Gate failures (count of rows where gate is False / confounded True):")
          for k,v in by_gate_false.most_common(): print(f"  {k:18s} {v}")
          print("")
          print("Fail reasons (token counts):")
          for k,v in by_reason.most_common(30): print(f"  {k:24s} {v}")
          near_miss.sort(reverse=True)
          print("")
          print("Top near-misses (failed exactly 1 reason):")
          for mean,sid,reason in near_miss[:15]: print(f"  mean={mean:+.6f}  {sid}  reason={reason}")
          PY
      - name: Horizon curve summary (no new files)
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f localdata/research/validated_slices.csv ]; then
            echo "No localdata/research/validated_slices.csv found; skipping horizon summary."
            exit 0
          fi
          PYTHONPATH=src python - <<'PY'
          import csv
          from collections import defaultdict
          from math import isnan
          PATH="localdata/research/validated_slices.csv"
          def as_int(x, default=0):
              try: return int(x)
              except: return default
          def as_float(x, default=float("nan")):
              try: return float(x)
              except: return default
          def is_true(x): return str(x)=="True"
          fam=defaultdict(dict); by_h=defaultdict(list)
          with open(PATH, newline="") as f:
              r=csv.DictReader(f)
              for row in r:
                  h=as_int(row.get("horizon_bars"),0)
                  row["_h"]=h
                  row["_mean"]=as_float(row.get("mean_ret_costadj"))
                  by_h[h].append(row)
                  key=(row.get("kind",""),row.get("feature",""),row.get("state",""),row.get("side",""))
                  fam[key][h]=row
          horizons=sorted(h for h in by_h.keys() if h>0)
          print(f"rows={sum(len(v) for v in by_h.values())} horizons={len(horizons)} range={min(horizons)}..{max(horizons)}")
          print("\nPer-horizon summary (avg_mean, mean_positive%, temporal_pass%, breadth_ok%, confounded%):")
          for h in horizons:
              rr=by_h[h]
              means=[r["_mean"] for r in rr if not isnan(r["_mean"])]
              avg=(sum(means)/len(means)) if means else float("nan")
              pos=sum(1 for r in rr if is_true(r.get("mean_positive")))
              temp=sum(1 for r in rr if is_true(r.get("temporal_pass")))
              breadth=sum(1 for r in rr if is_true(r.get("breadth_ok")))
              conf=sum(1 for r in rr if is_true(r.get("regime_confounded")))
              n=len(rr)
              print(f"h={h:2d} n={n:4d} mean={avg:+.6f} pos%={pos/n:6.1%} temp%={temp/n:6.1%} breadth%={breadth/n:6.1%} conf%={conf/n:6.1%}")
          def edge_per_bar(row):
              h=max(1, row["_h"]); m=row["_mean"]
              return (m/h) if not isnan(m) else float("-inf")
          summaries=[]
          for fk,byh in fam.items():
              rr=[byh[h] for h in sorted(byh.keys()) if h>0]
              candidates=[r for r in rr if is_true(r.get("direction_ok")) and not is_true(r.get("regime_confounded"))]
              if not candidates: continue
              best=max(candidates, key=edge_per_bar)
              hs=sorted(byh.keys())
              def first_h(pred):
                  for h in hs:
                      if h<=0: continue
                      if pred(byh[h]): return h
                  return None
              first_pos=first_h(lambda r: is_true(r.get("mean_positive")))
              first_temp=first_h(lambda r: is_true(r.get("temporal_pass")))
              first_breadth=first_h(lambda r: is_true(r.get("breadth_ok")))
              summaries.append((edge_per_bar(best),best["_mean"],best["_h"],fk,first_pos,first_temp,first_breadth,best.get("walk_forward_pass_pattern",""),best.get("breadth_ok","")))
          summaries.sort(reverse=True)
          print("\nTop families by edge_per_bar (direction_ok & not confounded):")
          for ebar,mean,hbest,fk,first_pos,first_temp,first_breadth,passes,breadth_best in summaries[:25]:
              kind,feature,state,side=fk
              print(f"{kind:4s} {feature}:{state}:{side}  best_h={hbest:2d} mean={mean:+.6f} edge/bar={ebar:+.8f}  first_pos={first_pos} first_temporal={first_temp} first_breadth={first_breadth}  breadth_ok@best={breadth_best} passes={passes}")
          PY
      - name: Per-asset gate summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f localdata/research/asset_edges.csv ]; then echo "No asset_edges.csv"; exit 0; fi
          PYTHONPATH=src python - <<'PY'
          import csv
          from collections import Counter
          path="localdata/research/asset_edges.csv"
          c=Counter()
          green=0; blocked=0; untested=0
          with open(path, newline="") as f:
              r=csv.DictReader(f)
              for row in r:
                  status=row.get("asset_status","")
                  c[status]+=1
                  if status=="green": green+=1
                  elif status=="blocked": blocked+=1
                  elif status=="untested": untested+=1
          print(f"Asset edges total: {sum(c.values())}")
          print(f"  green: {green} blocked: {blocked} untested: {untested}")
          print(f"  breakdown: {c.most_common()}")
          PY
      - name: Run optional weighted deep-history audit
        if: ${{ inputs.deep_audit != '' && inputs.deep_audit != 'none' }}
        env:
          BREAKWATER_MODE: readonly
          BREAKWATER_DATA_DIR: localdata
          BREAKWATER_CANDLE_PAGE_SLEEP_SECONDS: "0.05"
        run: |
          PYTHONPATH=src python scripts/breakwater.py deep-research-audit --lane "${{ inputs.deep_audit }}" --max-pairs 40 --candle-count 5000
      - name: Persist research inputs and status
        if: always()
        env:
          BREAKWATER_HEARTBEAT_URL: ${{ secrets.BREAKWATER_HEARTBEAT_URL }}
        run: bash scripts/commit_state.sh research
