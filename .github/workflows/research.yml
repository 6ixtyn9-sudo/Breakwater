name: Breakwater Research Refresh

on:
  workflow_dispatch:

concurrency:
  group: breakwater-research
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Import Price crypto candidates
        env:
          BREAKWATER_PRICE_CANDIDATES_URL: https://raw.githubusercontent.com/6ixtyn9-sudo/Price/main/localdata/research/crypto/monitored_candidates_crypto.csv
        run: PYTHONPATH=src python scripts/breakwater.py refresh-price

      - name: Run VALR-native shadow scan
        env:
          BREAKWATER_MODE: shadow
        run: PYTHONPATH=src python scripts/breakwater.py shadow-scan --max-pairs 12

      - name: Persist research inputs and status
        if: always()
        run: bash scripts/commit_state.sh "research refresh"
