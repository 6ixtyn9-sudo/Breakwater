name: Breakwater Research Refresh

on:
  workflow_dispatch:

concurrency:
  group: breakwater-state
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # 24 horizons can take a while. Bump this if you ever see timeouts.
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Ingest universe and run slice research
        env:
          VALR_API_KEY: ${{ secrets.VALR_API_KEY }}
          VALR_API_SECRET: ${{ secrets.VALR_API_SECRET }}
          BREAKWATER_MODE: readonly

          # Doctrine fallbacks (2026-08-19): fat 6-name edges, 20bp net floor,
          # two-horizon promote, ~1000h bars. Secrets/vars still win if set.
          # Prefer Actions Variables (not Secrets) for these non-sensitive knobs.

          # Promotion floor for net-edge (sync_book directional gate)
          BREAKWATER_MIN_NET_EDGE: ${{ secrets.BREAKWATER_MIN_NET_EDGE || vars.BREAKWATER_MIN_NET_EDGE || '0.002' }}

          # Multi-horizon robustness promotion gate
          BREAKWATER_PROMOTION_MULTI_HORIZON_MIN_PASSES: ${{ secrets.BREAKWATER_PROMOTION_MULTI_HORIZON_MIN_PASSES || vars.BREAKWATER_PROMOTION_MULTI_HORIZON_MIN_PASSES || '2' }}
          BREAKWATER_PROMOTION_MULTI_HORIZON_SELECT: ${{ secrets.BREAKWATER_PROMOTION_MULTI_HORIZON_SELECT || vars.BREAKWATER_PROMOTION_MULTI_HORIZON_SELECT || 'edge_per_bar' }}

          # Preferred: multi-horizon research
          BREAKWATER_RESEARCH_HORIZONS: ${{ secrets.BREAKWATER_RESEARCH_HORIZONS || vars.BREAKWATER_RESEARCH_HORIZONS || '' }}

          # Allow >8 horizons (engine clamp is configurable)
          BREAKWATER_RESEARCH_HORIZONS_MAX: "24"

          # Back-compat fallback (used if horizons is blank)
          BREAKWATER_RESEARCH_HORIZON_BARS: ${{ secrets.BREAKWATER_RESEARCH_HORIZON_BARS || vars.BREAKWATER_RESEARCH_HORIZON_BARS || '6' }}

          # === Research scale knobs ===
          BREAKWATER_SPOT_CANDLE_COUNT: ${{ secrets.BREAKWATER_SPOT_CANDLE_COUNT || vars.BREAKWATER_SPOT_CANDLE_COUNT || '1000' }}
          BREAKWATER_PERP_CANDLE_COUNT: ${{ secrets.BREAKWATER_PERP_CANDLE_COUNT || vars.BREAKWATER_PERP_CANDLE_COUNT || '1000' }}
          BREAKWATER_RESEARCH_MAX_PAIRS: ${{ secrets.BREAKWATER_RESEARCH_MAX_PAIRS || vars.BREAKWATER_RESEARCH_MAX_PAIRS || '60' }}

          # === Discovery binning knobs ===
          BREAKWATER_DISCOVERY_STATE_QUANTILES: ${{ secrets.BREAKWATER_DISCOVERY_STATE_QUANTILES || vars.BREAKWATER_DISCOVERY_STATE_QUANTILES || '0.333333,0.666666' }}
          BREAKWATER_DISCOVERY_ROLLING_MIN_PERIODS: ${{ vars.BREAKWATER_DISCOVERY_ROLLING_MIN_PERIODS || '200' }}

          # Optional politeness delay for paged candle fetches
          BREAKWATER_CANDLE_PAGE_SLEEP_SECONDS: ${{ vars.BREAKWATER_CANDLE_PAGE_SLEEP_SECONDS || '0.05' }}

          # RELAXED VALIDATION (still walk-forward + hostile-regime + net-positive)
          BREAKWATER_VALIDATION_REQUIRE_BONFERRONI: "0"
          BREAKWATER_VALIDATION_RELAXED_MIN_PASSES: ${{ secrets.BREAKWATER_VALIDATION_RELAXED_MIN_PASSES || vars.BREAKWATER_VALIDATION_RELAXED_MIN_PASSES || '2' }}
          BREAKWATER_VALIDATION_STRICT_PASS_FLOOR: ${{ secrets.BREAKWATER_VALIDATION_STRICT_PASS_FLOOR || vars.BREAKWATER_VALIDATION_STRICT_PASS_FLOOR || '3' }}

          # Breadth knobs (env-backed in validation.py)
          BREAKWATER_BREADTH_MIN_SYMBOLS: ${{ secrets.BREAKWATER_BREADTH_MIN_SYMBOLS || vars.BREAKWATER_BREADTH_MIN_SYMBOLS || '6' }}
          BREAKWATER_BREADTH_MIN_ROWS_PER_SYMBOL: ${{ secrets.BREAKWATER_BREADTH_MIN_ROWS_PER_SYMBOL || vars.BREAKWATER_BREADTH_MIN_ROWS_PER_SYMBOL || '10' }}
          BREAKWATER_BREADTH_MIN_POSITIVE_FRACTION: ${{ secrets.BREAKWATER_BREADTH_MIN_POSITIVE_FRACTION || vars.BREAKWATER_BREADTH_MIN_POSITIVE_FRACTION || '0.40' }}

          # Hunt: promote fat fail-only-breadth families (does not lower 0.40)
          BREAKWATER_CONCENTRATED_PROMOTE: ${{ secrets.BREAKWATER_CONCENTRATED_PROMOTE || vars.BREAKWATER_CONCENTRATED_PROMOTE || '1' }}
          BREAKWATER_CONCENTRATED_MIN_MEAN: ${{ secrets.BREAKWATER_CONCENTRATED_MIN_MEAN || vars.BREAKWATER_CONCENTRATED_MIN_MEAN || '0.004' }}
        run: PYTHONPATH=src python scripts/breakwater.py research

      - name: Validation diagnostics summary
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f localdata/research/validated_slices.csv ]; then
            echo "No localdata/research/validated_slices.csv found; skipping diagnostics."
            exit 0
          fi

          python - <<'PY'
          import csv
          from collections import Counter

          path = "localdata/research/validated_slices.csv"

          required_cols = [
              "slice_id",
              "validated",
              "mean_ret_costadj",
              "fail_reasons",
              "temporal_pass",
              "direction_ok",
              "breadth_ok",
              "recency_ok",
              "mean_positive",
              "regime_confounded",
          ]

          def split_reasons(s: str):
              s = (s or "").strip()
              if not s:
                  return []
              return [t.strip() for t in s.split(",") if t.strip()]

          total = 0
          validated_true = 0
          by_gate_false = Counter()
          by_reason = Counter()
          near_miss = []  # (mean, slice_id, single_reason)

          with open(path, newline="") as f:
              r = csv.DictReader(f)
              missing = [c for c in required_cols if c not in (r.fieldnames or [])]
              if missing:
                  raise SystemExit(f"validated_slices.csv missing columns: {missing}")

              for row in r:
                  total += 1
                  ok = (row.get("validated") == "True")
                  if ok:
                      validated_true += 1

                  for g in ["temporal_pass","direction_ok","breadth_ok","recency_ok","mean_positive"]:
                      if row.get(g) == "False":
                          by_gate_false[g] += 1
                  if row.get("regime_confounded") == "True":
                      by_gate_false["regime_confounded"] += 1

                  reasons = split_reasons(row.get("fail_reasons", ""))
                  for t in reasons:
                      by_reason[t] += 1

                  if (not ok) and len(reasons) == 1:
                      try:
                          mean = float(row.get("mean_ret_costadj") or "nan")
                      except Exception:
                          mean = float("-inf")
                      near_miss.append((mean, row.get("slice_id", ""), reasons[0]))

          print(f"Rows: {total}")
          print(f"Validated True: {validated_true}")
          print("")
          print("Gate failures (count of rows where gate is False / confounded True):")
          for k, v in by_gate_false.most_common():
              print(f"  {k:18s} {v}")
          print("")
          print("Fail reasons (token counts):")
          for k, v in by_reason.most_common(30):
              print(f"  {k:24s} {v}")

          near_miss.sort(reverse=True)
          print("")
          print("Top near-misses (failed exactly 1 reason):")
          for mean, sid, reason in near_miss[:15]:
              print(f"  mean={mean:+.6f}  {sid}  reason={reason}")
          PY

      - name: Horizon curve summary (no new files)
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f localdata/research/validated_slices.csv ]; then
            echo "No localdata/research/validated_slices.csv found; skipping horizon summary."
            exit 0
          fi

          python - <<'PY'
          import csv
          from collections import defaultdict
          from math import isnan

          PATH = "localdata/research/validated_slices.csv"

          def as_int(x, default=0):
              try:
                  return int(x)
              except Exception:
                  return default

          def as_float(x, default=float("nan")):
              try:
                  return float(x)
              except Exception:
                  return default

          def is_true(x):
              return str(x) == "True"

          # family -> horizon -> row
          fam = defaultdict(dict)
          by_h = defaultdict(list)

          with open(PATH, newline="") as f:
              r = csv.DictReader(f)
              for row in r:
                  h = as_int(row.get("horizon_bars"), 0)
                  row["_h"] = h
                  row["_mean"] = as_float(row.get("mean_ret_costadj"))
                  by_h[h].append(row)
                  key = (row.get("kind",""), row.get("feature",""), row.get("state",""), row.get("side",""))
                  fam[key][h] = row

          horizons = sorted(h for h in by_h.keys() if h > 0)
          print(f"rows={sum(len(v) for v in by_h.values())} horizons={len(horizons)} range={min(horizons)}..{max(horizons)}")

          print("\nPer-horizon summary (avg_mean, mean_positive%, temporal_pass%, breadth_ok%, confounded%):")
          for h in horizons:
              rr = by_h[h]
              means = [r["_mean"] for r in rr if not isnan(r["_mean"])]
              avg = (sum(means)/len(means)) if means else float("nan")
              pos = sum(1 for r in rr if is_true(r.get("mean_positive")))
              temp = sum(1 for r in rr if is_true(r.get("temporal_pass")))
              breadth = sum(1 for r in rr if is_true(r.get("breadth_ok")))
              conf = sum(1 for r in rr if is_true(r.get("regime_confounded")))
              n = len(rr)
              print(
                  f"h={h:2d} n={n:4d} mean={avg:+.6f} "
                  f"pos%={pos/n:6.1%} temp%={temp/n:6.1%} breadth%={breadth/n:6.1%} conf%={conf/n:6.1%}"
              )

          def edge_per_bar(row):
              h = max(1, row["_h"])
              m = row["_mean"]
              return (m / h) if not isnan(m) else float("-inf")

          summaries = []
          for fk, byh in fam.items():
              rr = [byh[h] for h in sorted(byh.keys()) if h > 0]
              # Choose best horizon among those that look directionally sane and not confounded.
              candidates = [
                  r for r in rr
                  if is_true(r.get("direction_ok")) and not is_true(r.get("regime_confounded"))
              ]
              if not candidates:
                  continue
              best = max(candidates, key=edge_per_bar)

              # Flip points
              hs = sorted(byh.keys())
              def first_h(pred):
                  for h in hs:
                      if h <= 0:
                          continue
                      if pred(byh[h]):
                          return h
                  return None

              first_pos = first_h(lambda r: is_true(r.get("mean_positive")))
              first_temp = first_h(lambda r: is_true(r.get("temporal_pass")))
              first_breadth = first_h(lambda r: is_true(r.get("breadth_ok")))

              summaries.append((
                  edge_per_bar(best),
                  best["_mean"],
                  best["_h"],
                  fk,
                  first_pos, first_temp, first_breadth,
                  best.get("walk_forward_pass_pattern",""),
                  best.get("breadth_ok",""),
              ))

          summaries.sort(reverse=True)

          print("\nTop families by edge_per_bar (direction_ok & not confounded):")
          for ebar, mean, hbest, fk, first_pos, first_temp, first_breadth, passes, breadth_best in summaries[:25]:
              kind, feature, state, side = fk
              print(
                  f"{kind:4s} {feature}:{state}:{side}  "
                  f"best_h={hbest:2d} mean={mean:+.6f} edge/bar={ebar:+.8f}  "
                  f"first_pos={first_pos} first_temporal={first_temp} first_breadth={first_breadth}  "
                  f"breadth_ok@best={breadth_best} passes={passes}"
              )
          PY

      - name: Persist research inputs and status
        if: always()
        run: bash scripts/commit_state.sh "research refresh"
