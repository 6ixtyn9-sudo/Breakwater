name: Breakwater Research Refresh

on:
  workflow_dispatch:

concurrency:
  group: breakwater-state
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Ingest universe and run slice research
        env:
          VALR_API_KEY: ${{ secrets.VALR_API_KEY }}
          VALR_API_SECRET: ${{ secrets.VALR_API_SECRET }}
          BREAKWATER_MODE: readonly

          # Multi-horizon research (preferred). Example: "6,12,24"
          BREAKWATER_RESEARCH_HORIZONS: ${{ secrets.BREAKWATER_RESEARCH_HORIZONS || vars.BREAKWATER_RESEARCH_HORIZONS || '6,12,24' }}
          # Back-compat fallback (used only if BREAKWATER_RESEARCH_HORIZONS is empty)
          BREAKWATER_RESEARCH_HORIZON_BARS: ${{ secrets.BREAKWATER_RESEARCH_HORIZON_BARS || vars.BREAKWATER_RESEARCH_HORIZON_BARS || '6' }}

          # Scale knobs
          BREAKWATER_SPOT_CANDLE_COUNT: ${{ secrets.BREAKWATER_SPOT_CANDLE_COUNT || vars.BREAKWATER_SPOT_CANDLE_COUNT || '1200' }}
          BREAKWATER_PERP_CANDLE_COUNT: ${{ secrets.BREAKWATER_PERP_CANDLE_COUNT || vars.BREAKWATER_PERP_CANDLE_COUNT || '1200' }}
          BREAKWATER_CANDLE_PAGE_SLEEP_SECONDS: ${{ vars.BREAKWATER_CANDLE_PAGE_SLEEP_SECONDS || '0.05' }}

          # Discovery binning knobs
          BREAKWATER_DISCOVERY_STATE_QUANTILES: ${{ secrets.BREAKWATER_DISCOVERY_STATE_QUANTILES || vars.BREAKWATER_DISCOVERY_STATE_QUANTILES || '0.2,0.8' }}
          BREAKWATER_DISCOVERY_ROLLING_MIN_PERIODS: ${{ vars.BREAKWATER_DISCOVERY_ROLLING_MIN_PERIODS || '200' }}

          # Relaxed validation gate (still requires net-positive mean + fold consistency + hostile-regime check)
          BREAKWATER_VALIDATION_REQUIRE_BONFERRONI: "0"
          BREAKWATER_VALIDATION_RELAXED_MIN_PASSES: "3"

        run: PYTHONPATH=src python scripts/breakwater.py research

      - name: Persist research inputs and status
        if: always()
        run: bash scripts/commit_state.sh "research refresh"
