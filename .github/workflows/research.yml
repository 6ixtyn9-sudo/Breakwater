      - name: Validation diagnostics summary
        run: |
          python - <<'PY'
          import csv
          from collections import Counter, defaultdict

          path = "localdata/research/validated_slices.csv"

          total = 0
          validated_true = 0
          by_reason = Counter()
          by_gate = Counter()
          near_miss = []  # (mean, slice_id, reasons)

          def split_reasons(s):
            s = (s or "").strip()
            if not s:
              return []
            return [t.strip() for t in s.split(",") if t.strip()]

          with open(path, newline="") as f:
            r = csv.DictReader(f)
            required_cols = ["slice_id","validated","mean_ret_costadj","fail_reasons",
                             "temporal_pass","direction_ok","breadth_ok","recency_ok","mean_positive",
                             "regime_confounded"]
            missing = [c for c in required_cols if c not in (r.fieldnames or [])]
            if missing:
              raise SystemExit(f"validated_slices.csv missing columns: {missing}")

            for row in r:
              total += 1
              ok = (row["validated"] == "True")
              if ok:
                validated_true += 1

              # Gate failure counters
              for g in ["temporal_pass","direction_ok","breadth_ok","recency_ok","mean_positive"]:
                if row.get(g) == "False":
                  by_gate[g] += 1
              if row.get("regime_confounded") == "True":
                by_gate["regime_confounded"] += 1

              reasons = split_reasons(row.get("fail_reasons",""))
              for t in reasons:
                by_reason[t] += 1

              # Near-miss list: failed only 1 reason
              if (not ok) and len(reasons) == 1:
                try:
                  mean = float(row["mean_ret_costadj"])
                except Exception:
                  mean = float("-inf")
                near_miss.append((mean, row["slice_id"], reasons[0]))

          print(f"Rows: {total}")
          print(f"Validated True: {validated_true}")
          print("")
          print("Gate failures (count of rows where gate is False):")
          for k,v in by_gate.most_common():
            print(f"  {k:18s} {v}")
          print("")
          print("Fail reasons (token counts):")
          for k,v in by_reason.most_common(20):
            print(f"  {k:18s} {v}")

          near_miss.sort(reverse=True)
          print("")
          print("Top near-misses (failed exactly 1 reason):")
          for mean, sid, reason in near_miss[:15]:
            print(f"  mean={mean:+.6f}  {sid}  reason={reason}")
          PY
