name: Breakwater HIP-3 Research  
on:
  workflow_dispatch:
concurrency:
  group: breakwater-hip3-research
  cancel-in-progress: false
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  research-shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ vars.BREAKWATER_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 180
    name: hip3 research shard ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Refresh HIP-3 inventory
        env:
          BREAKWATER_MODE: readonly
          BREAKWATER_DATA_DIR: localdata
        run: PYTHONPATH=src python scripts/breakwater.py hip3-discover
      - name: Set horizon group for shard
        id: horizons
        run: |
          case "${{ matrix.shard }}" in
            1) echo "horizons=1,2,3,4,5,6" >> $GITHUB_OUTPUT ;;
            2) echo "horizons=7,8,9,10,11,12" >> $GITHUB_OUTPUT ;;
            3) echo "horizons=13,14,15,16,17,18" >> $GITHUB_OUTPUT ;;
            4) echo "horizons=19,20,21,22,23,24" >> $GITHUB_OUTPUT ;;
          esac
          echo "Shard ${{ matrix.shard }} horizons: $(cat $GITHUB_OUTPUT)"
      - name: Audit candles and run isolated walk-forward research shard ${{ matrix.shard }}
        env:
          BREAKWATER_MODE: readonly
          BREAKWATER_DATA_DIR: localdata
          BREAKWATER_HIP3_RESEARCH_MAX_PAIRS: "40"
          BREAKWATER_HIP3_CANDLE_COUNT: "1000"
          BREAKWATER_HIP3_RESEARCH_HORIZONS: ${{ steps.horizons.outputs.horizons }}
          BREAKWATER_HIP3_RESEARCH_SHARD: h${{ matrix.shard }}
          BREAKWATER_HIP3_MAX_ORACLE_DEVIATION: "0.02"
          BREAKWATER_MIN_NET_EDGE: ${{ vars.BREAKWATER_MIN_NET_EDGE || '0.002' }}
          BREAKWATER_PROMOTION_MULTI_HORIZON_MIN_PASSES: ${{ vars.BREAKWATER_PROMOTION_MULTI_HORIZON_MIN_PASSES || '2' }}
          BREAKWATER_PROMOTION_MULTI_HORIZON_SELECT: ${{ vars.BREAKWATER_PROMOTION_MULTI_HORIZON_SELECT || 'edge_per_bar' }}
          BREAKWATER_MIN_GREEN_ASSETS_FOR_PROMOTION: "1"
          BREAKWATER_HIP3_USDC_TOKEN_ID: "0,235"
          BREAKWATER_HIP3_COST_BPS: "30"
          BREAKWATER_DISCOVERY_ROLLING_MIN_PERIODS: "200"
          BREAKWATER_DISCOVERY_STATE_QUANTILES: "0.333333,0.666666"
          BREAKWATER_VALIDATION_REQUIRE_BONFERRONI: "0"
          BREAKWATER_VALIDATION_RELAXED_MIN_PASSES: "2"
          BREAKWATER_BREADTH_MIN_SYMBOLS: "6"
          BREAKWATER_BREADTH_MIN_ROWS_PER_SYMBOL: "10"
          BREAKWATER_BREADTH_MIN_POSITIVE_FRACTION: "0.35"
          BREAKWATER_PER_ASSET_MIN_ROWS: "15"
          BREAKWATER_PER_ASSET_MIN_FOLD_POSITIVE_FRACTION: "0.50"
          BREAKWATER_PER_ASSET_FOLD_MIN_ROWS: "3"
        run: |
          echo "Running HIP-3 shard ${{ matrix.shard }} horizons ${{ steps.horizons.outputs.horizons }}"
          PYTHONPATH=src python scripts/breakwater.py hip3-research
          ls -lh localdata/hip3/research/*h${{ matrix.shard }}.csv || true
      - name: Upload HIP-3 shard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hip3-research-h${{ matrix.shard }}
          path: |
            localdata/hip3/research/discovered_slices_h${{ matrix.shard }}.csv
            localdata/hip3/research/validated_slices_h${{ matrix.shard }}.csv
            localdata/hip3/research/asset_edges_h${{ matrix.shard }}.csv
            localdata/hip3/research/candle_coverage.csv
          if-no-files-found: error
          retention-days: 2
  merge:
    needs: research-shard
    runs-on: ${{ vars.BREAKWATER_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Download all HIP-3 shards
        uses: actions/download-artifact@v4
        with:
          path: /tmp/hip3-shards
          pattern: hip3-research-h*
          merge-multiple: true
      - name: Merge HIP-3 shards and sync book
        env:
          BREAKWATER_MODE: readonly
          BREAKWATER_DATA_DIR: localdata
          BREAKWATER_MIN_NET_EDGE: ${{ vars.BREAKWATER_MIN_NET_EDGE || '0.002' }}
          BREAKWATER_PROMOTION_MULTI_HORIZON_MIN_PASSES: ${{ vars.BREAKWATER_PROMOTION_MULTI_HORIZON_MIN_PASSES || '2' }}
          BREAKWATER_PROMOTION_MULTI_HORIZON_SELECT: ${{ vars.BREAKWATER_PROMOTION_MULTI_HORIZON_SELECT || 'edge_per_bar' }}
          BREAKWATER_MIN_GREEN_ASSETS_FOR_PROMOTION: "1"
          BREAKWATER_PER_ASSET_MIN_ROWS: "15"
          BREAKWATER_PER_ASSET_MIN_FOLD_POSITIVE_FRACTION: "0.50"
          BREAKWATER_BREADTH_MIN_POSITIVE_FRACTION: "0.35"
        run: |
          set -euo pipefail
          ls -lh /tmp/hip3-shards/
          PYTHONPATH=src python - <<'PY'
          import csv, glob, re
          from pathlib import Path
          from breakwater.discovery import DISCOVERY_HEADERS
          from breakwater.validation import VALIDATED_HEADERS, ASSET_EDGE_HEADERS
          def merge_csv(pattern, out_path, headers):
              files=glob.glob(pattern)
              if not files:
                  print(f"No files for {pattern}")
                  return 0
              rows=[]
              for fp in files:
                  with open(fp, newline="") as f:
                      r=csv.DictReader(f)
                      rows.extend(list(r))
              by_id={}
              for row in rows:
                  sid=row.get("slice_id","")
                  prev=by_id.get(sid)
                  if prev is None:
                      by_id[sid]=row
                  else:
                      try:
                          if float(row.get("mean_ret_costadj",0)) > float(prev.get("mean_ret_costadj",0)):
                              by_id[sid]=row
                      except:
                          pass
              out_path.parent.mkdir(parents=True, exist_ok=True)
              with open(out_path,"w",newline="") as out:
                  w=csv.DictWriter(out, fieldnames=headers)
                  w.writeheader()
                  w.writerows(by_id.values())
              print(f"Merged {pattern} -> {out_path} {len(by_id)} rows from {len(files)} files")
              return len(by_id)
          def merge_asset_edges(pattern, out_path, headers):
              files=glob.glob(pattern)
              if not files:
                  print(f"No asset_edges files for {pattern}")
                  return 0
              rows=[]
              for fp in files:
                  with open(fp, newline="") as f:
                      rows.extend(list(csv.DictReader(f)))
              by_key={}
              for row in rows:
                  key=(row.get("slice_id",""), row.get("asset","").upper())
                  prev=by_key.get(key)
                  if prev is None:
                      by_key[key]=row
                  else:
                      try:
                          if float(row.get("mean_ret_costadj",0)) > float(prev.get("mean_ret_costadj",0)):
                              by_key[key]=row
                      except:
                          pass
              out_path.parent.mkdir(parents=True, exist_ok=True)
              with open(out_path,"w",newline="") as out:
                  w=csv.DictWriter(out, fieldnames=headers)
                  w.writeheader()
                  w.writerows(by_key.values())
              print(f"Merged asset_edges {pattern} -> {out_path} {len(by_key)} rows from {len(files)} files")
              return len(by_key)
          merge_csv("/tmp/hip3-shards/discovered_slices_h*.csv", Path("localdata/hip3/research/discovered_slices.csv"), DISCOVERY_HEADERS)
          merge_csv("/tmp/hip3-shards/validated_slices_h*.csv", Path("localdata/hip3/research/validated_slices.csv"), VALIDATED_HEADERS)
          merge_asset_edges("/tmp/hip3-shards/asset_edges_h*.csv", Path("localdata/hip3/research/asset_edges.csv"), ASSET_EDGE_HEADERS)
          import shutil
          cov_files=glob.glob("/tmp/hip3-shards/candle_coverage.csv")
          if cov_files:
              shutil.copy(cov_files[0], "localdata/hip3/research/candle_coverage.csv")
              print(f"Copied coverage from {cov_files[0]}")
          from breakwater.config import get_settings
          from breakwater.research_lifecycle import sync_book
          import csv as csvm
          settings=get_settings()
          validated_path=settings.hip3_validated_path
          book_path=settings.hip3_book_path
          validated_count=0
          if validated_path.exists():
              with open(validated_path, newline="") as f:
                  for row in csvm.DictReader(f):
                      if row.get("validated")=="True":
                          validated_count+=1
          print(f"HIP-3 validated count after merge: {validated_count}")
          try:
              summary=sync_book(validated_path=validated_path, book_path=book_path)
              print(f"HIP-3 book sync: {summary}")
          except Exception as e:
              print(f"Book sync failed: {e}")
              import traceback; traceback.print_exc()
          PY
      - name: HIP-3 diagnostics
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f localdata/hip3/research/validated_slices.csv ]; then echo "No validated"; exit 0; fi
          PYTHONPATH=src python - <<'PY'
          import csv
          from collections import Counter
          path="localdata/hip3/research/validated_slices.csv"
          total=0; val=0; by_reason=Counter()
          with open(path, newline="") as f:
              r=csv.DictReader(f)
              for row in r:
                  total+=1
                  if row.get("validated")=="True": val+=1
                  for tok in (row.get("fail_reasons") or "").split(","):
                      if tok.strip(): by_reason[tok.strip()]+=1
          print(f"HIP-3 Rows: {total} Validated: {val}")
          for k,v in by_reason.most_common(20): print(f"  {k}: {v}")
          PY
      - name: Persist isolated HIP-3 state
        if: always()
        env:
          BREAKWATER_HEARTBEAT_URL: ${{ secrets.BREAKWATER_HEARTBEAT_URL }}
        run: bash scripts/commit_state.sh hip3
