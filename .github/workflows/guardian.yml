name: Breakwater Guardian
on:
  workflow_dispatch:
    inputs:
      canary_pair:
        description: "Run the VALR order-path canary on this pair instead of the operational pass (blank = normal run)"
        required: false
        default: ""
      canary_ack:
        description: "Type I_ACCEPT_BREAKWATER_CANARY_ORDERS to actually place the two no-fill orders (blank = dry run)"
        required: false
        default: ""
concurrency:
  group: breakwater-guardian
  cancel-in-progress: false
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  guardian:
    runs-on: ${{ vars.BREAKWATER_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Restore transactional cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: localdata/breakwater.db
          key: breakwater-ledger-${{ github.run_id }}
          restore-keys: |
            breakwater-ledger-
      - name: VALR order-path canary
        if: inputs.canary_pair != ''
        env:
          VALR_API_KEY: ${{ secrets.VALR_API_KEY }}
          VALR_API_SECRET: ${{ secrets.VALR_API_SECRET }}
          # Not BREAKWATER_MODE/LIVE_ACK: proving the order path must not
          # require arming the strategy.
          BREAKWATER_CANARY_ACK: ${{ inputs.canary_ack }}
          # Via env, not interpolated into the script: a dispatch input
          # spliced straight into run: is a shell-injection vector.
          CANARY_PAIR: ${{ inputs.canary_pair }}
          CANARY_ARM: ${{ inputs.canary_ack != '' && '--arm' || '' }}
        run: |
          PYTHONPATH=src python scripts/valr_canary.py --pair "$CANARY_PAIR" $CANARY_ARM 2>&1 | tee /tmp/canary.txt
          { echo '```'; cat /tmp/canary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Run guarded operational pass
        if: inputs.canary_pair == ''
        env:
          VALR_API_KEY: ${{ secrets.VALR_API_KEY }}
          VALR_API_SECRET: ${{ secrets.VALR_API_SECRET }}
          BREAKWATER_MODE: ${{ vars.BREAKWATER_MODE || 'readonly' }}
          BREAKWATER_MIN_NET_EDGE: ${{ vars.BREAKWATER_MIN_NET_EDGE || '0' }}
          BREAKWATER_SPOT_CANDLE_COUNT: ${{ vars.BREAKWATER_SPOT_CANDLE_COUNT || '1000' }}
          BREAKWATER_PERP_CANDLE_COUNT: ${{ vars.BREAKWATER_PERP_CANDLE_COUNT || '1000' }}
          BREAKWATER_DISCOVERY_STATE_QUANTILES: ${{ vars.BREAKWATER_DISCOVERY_STATE_QUANTILES || '0.333333,0.666666' }}
          BREAKWATER_DISCOVERY_ROLLING_MIN_PERIODS: ${{ vars.BREAKWATER_DISCOVERY_ROLLING_MIN_PERIODS || '200' }}
          BREAKWATER_CANDLE_PAGE_SLEEP_SECONDS: ${{ vars.BREAKWATER_CANDLE_PAGE_SLEEP_SECONDS || '0.05' }}
          BREAKWATER_LIVE_ACK: ${{ vars.BREAKWATER_LIVE_ACK || 'off' }}
          BREAKWATER_MANDATE_JSON: ${{ secrets.BREAKWATER_MANDATE_JSON }}
          BREAKWATER_ENABLE_SPOT_MARGIN_SHORTS: ${{ vars.BREAKWATER_ENABLE_SPOT_MARGIN_SHORTS || '0' }}
          BREAKWATER_SPOT_MARGIN_ACK: ${{ vars.BREAKWATER_SPOT_MARGIN_ACK || 'off' }}
          BREAKWATER_GREEN_GATE: ${{ vars.BREAKWATER_GREEN_GATE || '1' }}
          BREAKWATER_PAPER_SESSIONS: ${{ vars.BREAKWATER_PAPER_SESSIONS || 'eu,us,asia' }}
          BREAKWATER_HIP3_PAPER: ${{ vars.BREAKWATER_HIP3_PAPER || '1' }}
          BREAKWATER_MULTI_ENGINE: ${{ vars.BREAKWATER_MULTI_ENGINE || '1' }}
          BREAKWATER_MAX_ENGINE_SIGNALS: ${{ vars.BREAKWATER_MAX_ENGINE_SIGNALS || '3' }}
          BREAKWATER_ENGINE_SESSIONS: ${{ vars.BREAKWATER_ENGINE_SESSIONS || 'asia,us' }}
        run: PYTHONPATH=src python scripts/breakwater.py operate --max-pairs 15
      - name: Persist bounded state
        if: always()
        env:
          BREAKWATER_HEARTBEAT_URL: ${{ secrets.BREAKWATER_HEARTBEAT_URL }}
        run: bash scripts/commit_state.sh guardian
      - name: Save transactional cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: localdata/breakwater.db
          key: breakwater-ledger-${{ github.run_id }}
