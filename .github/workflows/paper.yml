name: Breakwater Paper Trading

on:
  workflow_dispatch:

concurrency:
  group: breakwater-paper
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run monitored-slice shadow scan and paper cycle
        env:
          VALR_API_KEY: ${{ secrets.VALR_API_KEY }}
          VALR_API_SECRET: ${{ secrets.VALR_API_SECRET }}

          BREAKWATER_MODE: shadow

          # Keep consistent env across workflows (even if paper doesn't promote slices)
          BREAKWATER_MIN_NET_EDGE: ${{ secrets.BREAKWATER_MIN_NET_EDGE || vars.BREAKWATER_MIN_NET_EDGE || '0.002' }}

          # Keep monitoring aligned with research binning + history depth
          BREAKWATER_SPOT_CANDLE_COUNT: ${{ secrets.BREAKWATER_SPOT_CANDLE_COUNT || vars.BREAKWATER_SPOT_CANDLE_COUNT || '1000' }}
          BREAKWATER_PERP_CANDLE_COUNT: ${{ secrets.BREAKWATER_PERP_CANDLE_COUNT || vars.BREAKWATER_PERP_CANDLE_COUNT || '1000' }}
          BREAKWATER_DISCOVERY_STATE_QUANTILES: ${{ secrets.BREAKWATER_DISCOVERY_STATE_QUANTILES || vars.BREAKWATER_DISCOVERY_STATE_QUANTILES || '0.333333,0.666666' }}
          BREAKWATER_DISCOVERY_ROLLING_MIN_PERIODS: ${{ vars.BREAKWATER_DISCOVERY_ROLLING_MIN_PERIODS || '200' }}
          BREAKWATER_CANDLE_PAGE_SLEEP_SECONDS: ${{ vars.BREAKWATER_CANDLE_PAGE_SLEEP_SECONDS || '0.05' }}
          BREAKWATER_PAPER_TIME_STOP_BARS: "12"
          BREAKWATER_PAPER_MAX_POSITIONS: "15"
          BREAKWATER_PAPER_OLD_SEATS: "5"
          BREAKWATER_PAPER_FAT_SEATS: "10"
          # All 15 can be PERP; kind cap must not sit below total
          BREAKWATER_PAPER_MAX_POSITIONS_PER_KIND: ${{ vars.BREAKWATER_PAPER_MAX_POSITIONS_PER_KIND || '15' }}
          BREAKWATER_PAPER_MAX_POSITIONS_PER_SLICE: ${{ vars.BREAKWATER_PAPER_MAX_POSITIONS_PER_SLICE || '5' }}

          # Trailing (profit-protecting stop) - OFF by default
          BREAKWATER_TRAIL_ENABLE: "0"
          BREAKWATER_TRAIL_ACTIVATE_R: "1.0"
          BREAKWATER_TRAIL_DISTANCE_R: "1.0"
          BREAKWATER_TRAIL_IGNORE_TIME_STOP: "0"
          # Mandate / arming (paper uses authenticated endpoints)
          BREAKWATER_LIVE_ACK: ${{ secrets.BREAKWATER_LIVE_ACK }}
          BREAKWATER_INITIAL_EQUITY_ZAR: ${{ secrets.BREAKWATER_INITIAL_EQUITY_ZAR }}
          BREAKWATER_ABSOLUTE_EQUITY_FLOOR_ZAR: ${{ secrets.BREAKWATER_ABSOLUTE_EQUITY_FLOOR_ZAR }}
          BREAKWATER_MAX_TOTAL_LOSS_ZAR: ${{ secrets.BREAKWATER_MAX_TOTAL_LOSS_ZAR }}
          BREAKWATER_MAX_TOTAL_DRAWDOWN_FRACTION: ${{ secrets.BREAKWATER_MAX_TOTAL_DRAWDOWN_FRACTION }}
          BREAKWATER_RISK_PER_TRADE_ZAR: ${{ secrets.BREAKWATER_RISK_PER_TRADE_ZAR }}
          BREAKWATER_DAILY_LOSS_LIMIT_ZAR: ${{ secrets.BREAKWATER_DAILY_LOSS_LIMIT_ZAR }}
          BREAKWATER_SEVEN_DAY_LOSS_LIMIT_ZAR: ${{ secrets.BREAKWATER_SEVEN_DAY_LOSS_LIMIT_ZAR }}
          BREAKWATER_MAX_AGGREGATE_OPEN_RISK_ZAR: ${{ secrets.BREAKWATER_MAX_AGGREGATE_OPEN_RISK_ZAR }}
          BREAKWATER_MAX_POSITION_NOTIONAL_ZAR: ${{ secrets.BREAKWATER_MAX_POSITION_NOTIONAL_ZAR }}
          BREAKWATER_MAX_EFFECTIVE_LEVERAGE: ${{ secrets.BREAKWATER_MAX_EFFECTIVE_LEVERAGE }}
          BREAKWATER_PERP_LEVERAGE_CAP: ${{ secrets.BREAKWATER_PERP_LEVERAGE_CAP }}
          BREAKWATER_MAX_POSITIONS: ${{ secrets.BREAKWATER_MAX_POSITIONS }}
          # Optional spot margin shorts
          BREAKWATER_ENABLE_SPOT_MARGIN_SHORTS: ${{ secrets.BREAKWATER_ENABLE_SPOT_MARGIN_SHORTS || vars.BREAKWATER_ENABLE_SPOT_MARGIN_SHORTS || '0' }}
          BREAKWATER_SPOT_MARGIN_ACK: ${{ secrets.BREAKWATER_SPOT_MARGIN_ACK || vars.BREAKWATER_SPOT_MARGIN_ACK || 'off' }}
          BREAKWATER_PAPER_ENTRY_MODE: ${{ secrets.BREAKWATER_PAPER_ENTRY_MODE || vars.BREAKWATER_PAPER_ENTRY_MODE || 'aligned' }}
          BREAKWATER_PAPER_SELECTION_MODE: ${{ secrets.BREAKWATER_PAPER_SELECTION_MODE || vars.BREAKWATER_PAPER_SELECTION_MODE || 'profit' }}
          BREAKWATER_PAPER_R_GATE: ${{ secrets.BREAKWATER_PAPER_R_GATE || vars.BREAKWATER_PAPER_R_GATE || '1' }}
          # Hunt: skip Asia (00-07 UTC); juice on this book is EU/US
          BREAKWATER_PAPER_SESSIONS: ${{ secrets.BREAKWATER_PAPER_SESSIONS || vars.BREAKWATER_PAPER_SESSIONS || 'eu,us' }}
          BREAKWATER_FILTER_NONPOSITIVE_BOOK: "1"

        run: PYTHONPATH=src python scripts/breakwater.py shadow-scan --max-pairs 30
      - name: Persist bounded state
        if: always()
        run: bash scripts/commit_state.sh paper
