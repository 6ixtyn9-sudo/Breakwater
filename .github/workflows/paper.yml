name: Breakwater Paper Trading

on:
  workflow_dispatch:

concurrency:
  group: breakwater-paper
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  paper:
    runs-on: ${{ vars.BREAKWATER_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run monitored-slice shadow scan and paper cycle
        env:
          VALR_API_KEY: ${{ secrets.VALR_API_KEY }}
          VALR_API_SECRET: ${{ secrets.VALR_API_SECRET }}

          BREAKWATER_MODE: shadow

          # Keep consistent env across workflows (even if paper doesn't promote slices)
          BREAKWATER_MIN_NET_EDGE: ${{ vars.BREAKWATER_MIN_NET_EDGE || '0.004' }}
          # Green-account gate: block proven not-green slices / freeze red lanes.
          # Default on; exposed here so the gate's action is explicit & auditable.
          BREAKWATER_GREEN_GATE: ${{ vars.BREAKWATER_GREEN_GATE || '1' }}

          # Keep monitoring aligned with research binning + history depth
          BREAKWATER_SPOT_CANDLE_COUNT: ${{ vars.BREAKWATER_SPOT_CANDLE_COUNT || '1000' }}
          BREAKWATER_PERP_CANDLE_COUNT: ${{ vars.BREAKWATER_PERP_CANDLE_COUNT || '1000' }}
          BREAKWATER_DISCOVERY_STATE_QUANTILES: ${{ vars.BREAKWATER_DISCOVERY_STATE_QUANTILES || '0.333333,0.666666' }}
          BREAKWATER_DISCOVERY_ROLLING_MIN_PERIODS: ${{ vars.BREAKWATER_DISCOVERY_ROLLING_MIN_PERIODS || '200' }}
          BREAKWATER_CANDLE_PAGE_SLEEP_SECONDS: ${{ vars.BREAKWATER_CANDLE_PAGE_SLEEP_SECONDS || '0.05' }}
          BREAKWATER_PAPER_TIME_STOP_BARS: "20"  # CHANGED: was "12"
          BREAKWATER_PAPER_MAX_POSITIONS: "24"
          BREAKWATER_PAPER_OLD_SEATS: "12"
          BREAKWATER_PAPER_FAT_SEATS: "10"
          
          # All 15 can be PERP; kind cap must not sit below total
          BREAKWATER_PAPER_MAX_POSITIONS_PER_KIND: ${{ vars.BREAKWATER_PAPER_MAX_POSITIONS_PER_KIND || '30' }}
          BREAKWATER_PAPER_MAX_POSITIONS_PER_SLICE: ${{ vars.BREAKWATER_PAPER_MAX_POSITIONS_PER_SLICE || '5' }}

          # Trailing (profit-protecting stop) - ON per counterfactual analysis.
          # Activate at +0.75R, trail at 1.0R distance, ignore time-stop when active.
          BREAKWATER_TRAIL_ENABLE: "1"           # CHANGED: was "0"
          BREAKWATER_TRAIL_ACTIVATE_R: "0.75"    # CHANGED: was "1.0"
          BREAKWATER_TRAIL_DISTANCE_R: "1.0"
          BREAKWATER_TRAIL_IGNORE_TIME_STOP: "1" # CHANGED: was "0"

          # Warming: smaller position sizes until slice has enough closes
          BREAKWATER_PAPER_WARMING_ENABLED: "1"  # NEW
          # Gap monitor: pause entries when price gaps beyond book
          BREAKWATER_PAPER_SLICE_GAP_BARS: "12"  # NEW
          BREAKWATER_PAPER_MAX_BOOK_SLICES: "20"  # NEW
          # Rotated exit (a/re-a after time-stop): disabled pending counterfactual proof
          BREAKWATER_PAPER_ROTATED_EXIT: "0"     # NEW

          # Mandate / arming (paper uses authenticated endpoints)
          BREAKWATER_HIP3_PAPER: ${{ vars.BREAKWATER_HIP3_PAPER || '1' }}
          BREAKWATER_LIVE_ACK: ${{ vars.BREAKWATER_LIVE_ACK || 'off' }}
          BREAKWATER_MANDATE_JSON: ${{ secrets.BREAKWATER_MANDATE_JSON }}
          # Optional spot margin shorts
          BREAKWATER_ENABLE_SPOT_MARGIN_SHORTS: ${{ vars.BREAKWATER_ENABLE_SPOT_MARGIN_SHORTS || '0' }}
          BREAKWATER_SPOT_MARGIN_ACK: ${{ vars.BREAKWATER_SPOT_MARGIN_ACK || 'off' }}
          BREAKWATER_PAPER_ENTRY_MODE: ${{ vars.BREAKWATER_PAPER_ENTRY_MODE || 'aligned' }}
          BREAKWATER_PAPER_SELECTION_MODE: ${{ vars.BREAKWATER_PAPER_SELECTION_MODE || 'profit' }}
          BREAKWATER_PAPER_R_GATE: ${{ vars.BREAKWATER_PAPER_R_GATE || '1' }}
          # Hunt: include Asia now (00-07 UTC) – book trades all sessions
          BREAKWATER_PAPER_SESSIONS: ${{ vars.BREAKWATER_PAPER_SESSIONS || 'eu,us,asia' }}
          BREAKWATER_FILTER_NONPOSITIVE_BOOK: "1"
          BREAKWATER_PAPER_MAX_RISK_FRACTION: ${{ vars.BREAKWATER_PAPER_MAX_RISK_FRACTION || '0.06' }}
          BREAKWATER_PAPER_RISK_TO_MEAN_K: ${{ vars.BREAKWATER_PAPER_RISK_TO_MEAN_K || '8' }}
          BREAKWATER_PAPER_SIZE_FROM_EQUITY: ${{ vars.BREAKWATER_PAPER_SIZE_FROM_EQUITY || '1' }}
          BREAKWATER_PAPER_RISK_OF_EQUITY: ${{ vars.BREAKWATER_PAPER_RISK_OF_EQUITY || '0.01' }}
          # Equity mode: notional ceiling is a fraction of equity (compounds).
          # Flat mode ignores this and keeps the mandate's absolute cap.
          BREAKWATER_PAPER_MAX_POSITION_NOTIONAL_OF_EQUITY: ${{ vars.BREAKWATER_PAPER_MAX_POSITION_NOTIONAL_OF_EQUITY || '0.20' }}
          # Cost model (round-trip bps): VALR spot fiat tier 1 / Hyperliquid base
          BREAKWATER_SPOT_FEE_BPS: ${{ vars.BREAKWATER_SPOT_FEE_BPS || '70' }}
          BREAKWATER_PERP_FEE_BPS: ${{ vars.BREAKWATER_PERP_FEE_BPS || '9' }}
          # HIP-3 subpool: max positions per slice (concentration guard)
          BREAKWATER_HIP3_MAX_POSITIONS_PER_SLICE: ${{ vars.BREAKWATER_HIP3_MAX_POSITIONS_PER_SLICE || '3' }}
          BREAKWATER_PAPER_EQUITY_SEED: ${{ vars.BREAKWATER_PAPER_EQUITY_SEED || '2000' }}
          # Multi-engine system: always-on signals independent of book
          BREAKWATER_MULTI_ENGINE: ${{ vars.BREAKWATER_MULTI_ENGINE || '1' }}
          BREAKWATER_MAX_ENGINE_SIGNALS: ${{ vars.BREAKWATER_MAX_ENGINE_SIGNALS || '5' }}

          # Paper-only aggregate stop-risk ceiling
          BREAKWATER_PAPER_MAX_AGGREGATE_RISK_OF_EQUITY: ${{ vars.BREAKWATER_PAPER_MAX_AGGREGATE_RISK_OF_EQUITY || '0.07' }}
          BREAKWATER_PAPER_MAX_AGGREGATE_OPEN_RISK_ZAR: ${{ vars.BREAKWATER_PAPER_MAX_AGGREGATE_OPEN_RISK_ZAR || '' }}

        run: PYTHONPATH=src python scripts/breakwater.py shadow-scan --max-pairs 30
      - name: Persist bounded state
        if: always()
        env:
          BREAKWATER_HEARTBEAT_URL: ${{ secrets.BREAKWATER_HEARTBEAT_URL }}
        run: bash scripts/commit_state.sh paper
