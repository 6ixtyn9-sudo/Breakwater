[project]
name = "breakwater"
version = "0.2.0"
description = "VALR-native 24/7 crypto universe research and guarded execution system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.2.6",
  "python-dotenv==1.2.2",
  "requests==2.33.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.16.3", "PyYAML==6.0.3"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
